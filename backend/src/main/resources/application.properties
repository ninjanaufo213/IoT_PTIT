server.port=8080

# ---- MySQL (chạy database/init.sql trước) ----
spring.datasource.url=jdbc:mysql://localhost:3306/iot_database?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---- MQTT (khớp với sketch ESP32) ----
mqtt.broker-url=${MQTT_URL:tcp://localhost:1884}
mqtt.username=${MQTT_USER:HoangXuanVinh}
mqtt.password=${MQTT_PASSWORD:B23DCCN929}
mqtt.topic.data=esp32/iot/data
mqtt.topic.control=esp32/iot/control
mqtt.topic.action-history=esp32/iot/action-history

# Quá 5 giây không có phản hồi từ ESP32 thì lệnh được coi là lỗi
led.confirm-timeout-seconds=5
